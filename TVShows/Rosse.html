<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Show</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<style>
    *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: monospace;
}
body{
    background-color: rgb(43, 43, 43);
}
body::-webkit-scrollbar{
    display: none;
}
.container{
    width: 100%;
}
.navbar{
    width: 100%;
    height: 50px;
    display: flex;
    align-items: center;
    padding: 0 50px;
    position: sticky;
    top: 0;
    z-index: 999;
}
.navbar>.logo{
    width: 50%;
    font-size: 20px;
    font-weight: 700;
    color: white;
}
.navbar>.logo>input{
    width: 200px;
    height: 30px;
    margin-left: 50px;
    background-color: rgba(129, 129, 129, 0.329);
    border: none;
    border-radius: 45px;
    padding: 2px 25px;
    color: white;
}
.navbar>.logo>i:nth-child(2){
    font-size: 15px;
    color: rgba(156, 155, 155, 0.541);
    transform: translate(85px);
}
.navbar>.logo>input:focus{
    outline: none;

}
.navbar>.menu{
    width: 50%;
    text-align: end;
    /* margin-left: 10px; */
}
.navbar>.menu>a{
    text-decoration: none;
    margin-left: 30px;
    font-size: 16px;
    color: white;
}
.navbar>.menu>a:hover{
    border-bottom: 2px solid white;
}
    .wrappers{
        width: 100%;
        height: 93vh;
        background-color: rgba(0, 0, 0, 0.274);
        display: flex;
        /* justify-content: center; */
        align-items: center;
        font-family: monospace;
        font-size: 15px;
        font-weight: 300;
    }
    .wrappers>.movie{
        width: 60%;
        height: 100%;
        display: flex;
        align-items: center;
        background-color: black;
    }
    .wrappers>.des{
        width: 40%;
        height: 100%;
        background-color: rgb(53, 53, 53);
        display: flex;
        flex-direction: column;
        padding: 20px 30px;
        color: white;
    }
    .wrappers>.des>h3{
        font-weight: 900;
        font-size: 20px;
    }
    .wrappers>.des>span{
        color: gray;
        margin: 5px 0;
        font-size: 13px;
    }
    .wrappers>.des>p{
        color: rgb(180, 179, 179);
        margin: 0px 10px;
        font-size: 13px;
    }
    .wrappers>.des>.status{
        width: 100%;
        height: 80px;
        /* background-color: aqua; */
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        justify-content: space-between;
        align-items: center;
        transform: translateX(-30px);
    }
    .wrappers>.des>.status>.box{
        /* width: ; */
        height: 100%;
        /* background-color: blue; */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    .wrappers>.des>.status>.box>i{
        font-size: 20px;
    }
    .wrappers>.des>.status>.box>span{
        font-size: 12px;
        font-family: 'Times New Roman', Times, serif;
    }
    .des>h4{
        margin-top: 100px;
    }
    .wrappers>.des>.description{
        width: 90%;
        height: 40px;
        margin-top: 30px;
        display: flex;
        align-items: center;
        /* justify-content: center; */
        background-color: transparent;
        box-shadow: 2px 2px 5px gray;
        border-radius: 5px;
        padding: 0 10px;
    }
    .wrappers>.des>.ep{
        margin-top: 20px;
        width: 90%;
        min-height: 100px;
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
    }
    .des>.ep>button{
        width: 100px;
        height: 40px;
        background-color: transparent;
        border: none;
        box-shadow: 2px 2px 5px rgb(24, 23, 23);
        border-radius: 5px;
        color: white;
    }

</style>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="logo"><i class="fa-solid fa-video"></i>Team2 <i class="fa-solid fa-magnifying-glass"></i> <input type="text" placeholder="Search"></div>
            <div class="menu">
                <a href="../index.html">Home</a>
                <a href="../movie.html">Movies</a>
                <a href="../tvshows.html">TV-shows</a>
                <a href="../sport.html">Sports</a>
                <a href="#about">About</a>
            </div>
        </nav>
        <div class="wrappers">
            <div class="movie">
                <iframe width="1100" height="500" src="https://www.youtube.com/embed/62VN_HFBA48?si=FoHzsNwecNwViaWE" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
            <div class="des">
                <h3>Road House</h3>
                <span>Dec 20, 2025</span><br>
                <p>Amereca | Ongoing | Hollywood</p>
                <div class="status">
                    <div class="box">
                        <i class="fa-regular fa-heart"></i>
                        <span>Favorite</span>
                    </div>
                    <div class="box">
                        <i class="fa-solid fa-share-nodes"></i>
                        <span>Share</span>
                    </div>
                    <div class="box">
                        <i class="fa-solid fa-cloud-arrow-down"></i>
                        <span>Download</span>
                    </div>
                    <div class="box">
                        <i class="fa-solid fa-circle-info"></i>
                        <span>Report</span>
                    </div>
                </div>
                <div class="description">
                    Description
                </div>
                <h4>Episode</h4>
                <div class="ep">
                    <button>Ep 1</button>
                </div>
            </div>
            
        </div>
    </div>
</body>
</html>
